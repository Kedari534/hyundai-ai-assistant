# ============================================================
# application.yml — Spring Boot configuration
# All secrets come from environment variables (never hardcoded)
# ============================================================

spring:
  application:
    name: hyundai-ai-assistant

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5          # Keep low for free-tier 512MB RAM
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000         # Prevents Supabase idle disconnects

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate            # Flyway owns DDL; Hibernate only validates
    show-sql: false
    open-in-view: false             # Avoid lazy-loading anti-pattern
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        format_sql: false

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── File Upload ───────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: ${INGESTION_MAX_FILE_SIZE_MB:20}MB
      max-request-size: ${INGESTION_MAX_FILE_SIZE_MB:20}MB

  # ── Spring AI ─────────────────────────────────────────────
  ai:
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}
        chat:
          options:
            model: ${SPRING_AI_GOOGLE_GENAI_CHAT_MODEL:gemini-2.0-flash}
            temperature: 0.1            # Low temperature = factual, grounded responses
            max-tokens: 2048
        embedding:
          api-key: ${GOOGLE_AI_API_KEY}
          options:
            model: ${SPRING_AI_GOOGLE_GENAI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: ${SPRING_AI_GOOGLE_GENAI_EMBEDDING_DIMENSIONS:3072}

# ── Server ────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    include-message: never          # Never leak internal errors to clients
    include-stacktrace: never

# ── Actuator (health check for UptimeRobot ping) ──────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Hyundai AI Assistant
    version: 1.0.0
    description: RAG-based Hyundai automotive consultant

# ── App custom properties ─────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS:3600000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  supabase:
    url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:brochures}
  ingestion:
    chunk-size: ${INGESTION_CHUNK_SIZE:512}
    chunk-overlap: ${INGESTION_CHUNK_OVERLAP:64}
    max-file-size-mb: ${INGESTION_MAX_FILE_SIZE_MB:20}
    # CRITICAL: must match gemini-embedding-001 output dimension
    embedding-dimension: ${SPRING_AI_GOOGLE_GENAI_EMBEDDING_DIMENSIONS:3072}

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.cyepro.hyundai: DEBUG
    org.springframework.ai: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
